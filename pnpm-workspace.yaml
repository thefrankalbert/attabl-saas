onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@sentry/cli'
  - '@swc/core'
  - core-js
  - esbuild
  - sharp
  - supabase
  - unrs-resolver

overrides:
  # Pinned (not >=0.91.1): CI supply-chain policy rejects releases younger
  # than 24h and a floating range resolves to the freshest publish.
  '@anthropic-ai/sdk@>=0.79.0 <0.91.1': 0.109.0
  '@babel/core@<=7.29.0': '>=7.29.6'
  '@opentelemetry/core@<2.8.0': '>=2.8.0'
  # brace-expansion ReDoS (GHSA-mh99-v99m-4gvg) is patched ONLY in 5.0.8, whose
  # export shape needs a modern minimatch - hence minimatch is pinned to 10.2.5
  # below (only exceljs still pulled an old minimatch; verified: Excel export OK).
  # 5.0.9 corrige un CONTOURNEMENT de la mitigation precedente (GHSA-rgw5-rvv9-x895):
  # 5.0.8 restait vulnerable au DoS par tableaux intermediaires non bornes.
  brace-expansion: 5.0.9
  # CFG/LOT 5: 11 lignes `dompurify@<X` empilees ont ete consolidees en une seule.
  # Empilees, elles ne durcissaient rien de plus - la borne effective restait la plus
  # permissive - mais chaque nouvel avis en ajoutait une, et personne ne pouvait plus
  # dire quelle version etait reellement exigee. Une seule borne, la plus haute.
  dompurify: '>=3.4.12'
  # 4.1.1 est vulnerable (GHSA-7p8r-x3mc-p8w7), corrige en 4.1.2.
  fast-uri: 4.1.2
  # eslint tire encore une chaine flat-cache/flatted et js-yaml vulnerables.
  flatted: '>=3.4.2'
  js-yaml@>=4.0.0: '>=4.3.0'
  # ajv 6.x (dependance d'eslint). BORNE A LA LIGNE 6: un simple '>=6.14.0'
  # resout en 8.x, dont l'API differe, et @eslint/eslintrc plante au chargement
  # ("Cannot set properties of undefined (setting 'defaultMeta')") - donc lint KO.
  ajv@<6.14.0: '^6.14.0'
  minimatch: 10.2.5
  # nanoid: GHSA-2v37-7h3g-55p8, avis publie apres le lot dependances du 05/08.
  # Tire par next>postcss>nanoid, donc dependance de PRODUCTION: l'audit --prod
  # echoue tant que la borne n'est pas posee. Corrige a partir de 3.3.17.
  nanoid@<3.3.17: '>=3.3.17'
  # tar: une faille CRITIQUE plus quatre hautes, tirees par la CLI supabase.
  tar: '>=7.5.21'
  # vite est tire par vitest (outillage de test). Cle SIMPLE et non `vite@>=7.0.0`:
  # mesure sur ce depot, la forme avec plage ne s'applique pas a une dependance
  # peer - vite restait en 7.3.1 et l'audit continuait d'echouer.
  vite: '>=7.3.5'
  # ws: seul >=8.21.0 corrige, y compris pour les chaines encore en 7.x (aucune
  # version 7 corrigee n'existe). webpack-bundle-analyzer est le seul a demander
  # la ligne 7, et il ne sert qu'au diagnostic de bundle (ANALYZE=true).
  ws: '>=8.21.0'
  yaml@>=2.0.0: '>=2.8.3'
  esbuild@<0.28.1: '>=0.28.1'
  picomatch@<2.3.2: '>=2.3.2'
  picomatch@>=4.0.0 <4.0.4: '>=4.0.4'
  postcss@<8.5.18: 8.5.23
  sharp@<0.35.0: 0.35.3
  rollup@>=4.0.0 <4.59.0: '>=4.59.0'
  serialize-javascript: '>=7.0.3'
  uuid@<11.1.1: '>=11.1.1'
