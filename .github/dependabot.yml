# Mises a jour automatiques des dependances.
# Une seule proposition groupee par semaine pour les correctifs et versions
# mineures; les versions majeures restent des propositions separees, a relire.
# Delai de 7 jours avant de proposer une version toute neuve: une version
# piegee est en general retiree du registre avant ce delai (attaque par la
# chaine d'approvisionnement). Meme delai que `minimum-release-age` de .npmrc.
# Correctif de securite urgent sur une version de moins de 7 jours: ajouter le
# paquet a `minimumReleaseAgeExclude` dans pnpm-workspace.yaml le temps de la
# mise a jour, puis l'en retirer.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      mineures-et-correctifs:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
