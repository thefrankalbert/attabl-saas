# Mises a jour automatiques des dependances.
# Une seule proposition groupee par semaine pour les correctifs et versions
# mineures; les versions majeures restent des propositions separees, a relire.
# Delai de 7 jours avant de proposer une version toute neuve: une version
# piegee est en general retiree du registre avant ce delai (attaque par la
# chaine d'approvisionnement). Meme delai que `minimum-release-age` de .npmrc.
# Correctif de securite urgent sur une version de moins de 7 jours: ajouter le
# paquet a `minimumReleaseAgeExclude` dans pnpm-workspace.yaml le temps de la
# mise a jour, puis l'en retirer.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    # zxing-wasm ne se monte JAMAIS seul. QRScanner.tsx l'importe en direct
    # pour que le bundler serve le .wasm sous /_next/static, depuis notre
    # domaine: la CSP refuse fastly.jsdelivr.net, et sans cet import le client
    # voyait "camera non disponible" sur iPhone (incident du 2026-11-17). La
    # version doit donc rester EXACTEMENT celle que resout
    # @yudiel/react-qr-scanner via barcode-detector/ponyfill, sinon le binaire
    # servi n'est pas celui qu'attend le scanner. Le test
    # src/lib/__tests__/qr-scanner-wasm.test.ts compare les deux empreintes et
    # refuse tout decalage, donc une proposition de Dependabot sur ce paquet
    # seul ne peut pas passer la CI. La montee se fait a la main, en meme temps
    # que @yudiel/react-qr-scanner, les deux etant epingles au patch pres.
    ignore:
      - dependency-name: zxing-wasm
    groups:
      mineures-et-correctifs:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
