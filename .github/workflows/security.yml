name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'

# Least privilege: the token can only read the code. A job that needs more
# asks for it in its own `permissions:` block.
permissions:
  contents: read

jobs:
  semgrep:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.185.0@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # --error: the gate. Without it semgrep exits 0 even with findings, which is
      # how 48 findings sat unnoticed behind a green check until 2026-11-20.
      # A justified false positive is silenced in place with
      # `// nosemgrep: <rule> -- <why>`, never by dropping this flag.
      # The rule packs (p/...) are fetched from the Semgrep registry on each run,
      # on purpose: a new rule that finds a real flaw turns this check red with no
      # code change, and the flaw is then fixed. That is the point of the gate.
      - run: semgrep scan --config p/default --config p/nextjs --config p/typescript --config p/owasp-top-ten --error --sarif --output semgrep.sarif .
      - name: Upload SARIF artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: ignore

  # The repository is public, so code scanning is free: Semgrep findings also show
  # in the Security tab. Semgrep keeps the `nosemgrep` findings in its SARIF
  # (marked "suppressions"); GitHub would open an alert for each, so they are
  # dropped first. Skipped for pull requests from forks, whose token cannot
  # write security events.
  semgrep-publish:
    name: Publish Semgrep findings
    needs: semgrep
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: semgrep-sarif
      - name: Drop findings silenced in the code
        run: jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep-open.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep-open.sarif
          category: semgrep

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Pas de `version:` ici: la version vient de `packageManager` dans
      # package.json. `latest` etait en plus incoherent avec ci.yml, donc
      # l'audit de dependances pouvait resoudre un autre arbre que le build.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # CI-01: alignee sur ci.yml (Node 20) et sur `engines` de package.json.
          # Deux jobs sur deux majeures de Node peuvent resoudre des arbres de
          # dependances differents: l'audit ne portait alors pas sur ce qui est
          # reellement builde et deploye.
          node-version: '24'
          cache: 'pnpm'
      # --ignore-scripts: this job only audits the dependency graph; it does not
      # need native build steps. Newer pnpm (version: latest) hard-errors on
      # unapproved build scripts (ERR_PNPM_IGNORED_BUILDS), which is irrelevant
      # here and was failing the gate. Skipping scripts sidesteps it cleanly.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Blocking for ALL dependencies, dev included: build and test tools run in
      # CI with the repository secrets, so a flaw there is a real risk too.
      - name: Audit all dependencies
        run: pnpm audit --audit-level=high

  workflow-lint:
    name: Workflow Lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Checks every workflow file: YAML and expression errors, unknown inputs,
      # and the shell scripts through shellcheck. Exits non-zero on any finding.
      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      # Run gitleaks directly via its official image instead of gitleaks-action@v2.
      # The action required a GITLEAKS_LICENSE / extra token permissions and 403'd
      # on pull_request events. This pins the scan to the repo's .gitleaks.toml
      # (which allowlists test-fixture / doc false positives) and fails ONLY on a
      # real leak (--exit-code 1).
      - name: Scan for secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml \
            --no-banner --redact --exit-code 1
