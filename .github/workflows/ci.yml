name: CI

on:
  push:
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        # Pas de `version:` ici. La version vient de `packageManager` dans
        # package.json, seule source de verite: c'est ce qui garantit que la CI
        # installe la meme version que la machine de dev. Definir les deux fait
        # echouer l'action des l'installation ("Multiple versions of pnpm
        # specified"), ce qui bloque toute PR touchant package.json.
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 0: Critical files — ensure security-critical files exist
      - name: Critical files guard
        run: |
          CRITICAL_FILES=(
            "src/proxy.ts"
            "src/lib/supabase/client.ts"
            "src/lib/supabase/server.ts"
            "src/lib/supabase/admin.ts"
            "src/lib/supabase/middleware.ts"
            "src/lib/rate-limit.ts"
          )
          MISSING=0
          for f in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::CRITICAL FILE MISSING: $f — this file is required for auth, security, and multi-tenant isolation."
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "::error::One or more critical files are missing. This will break authentication and tenant isolation. Restore them before merging."
            exit 1
          fi
          echo "All critical files present."

      # Gate 0.5: Dependency vulnerability audit - BLOQUANTE depuis 2026-11-04.
      #
      # Elle etait non bloquante ("warning for now, upgrade once all known CVEs
      # are triaged"), et c'est exactement ce qui a laisse 7 failles CRITIQUES
      # arriver en production, dont plusieurs RCE non authentifiees de Next.js
      # 16.2.12. Un avertissement que personne ne lit ne protege de rien.
      #
      # Mesure du 2026-11-04 apres la montee de version : 0 critique, 0 haute,
      # 0 moyenne, 0 basse sur `pnpm audit --prod`. La porte est donc posee au
      # reel, pas au-dessus.
      #
      # Seuil a `high` et non `moderate` : une faille moyenne publiee demain sur
      # une dependance transitive sans correctif disponible bloquerait TOUS les
      # merges sans qu'une ligne soit plus sure. Meme seuil que security.yml,
      # pour que les deux portes ne puissent pas diverger.
      - name: Security audit
        run: pnpm audit --prod --audit-level=high

      # Visibilite sur ce qui est sous le seuil bloquant, sans bloquer.
      - name: Security audit (moyennes et basses, non bloquant)
        run: pnpm audit --prod --audit-level=moderate || echo "::warning::des failles moyennes ou basses existent - a traiter avant la prochaine release"

      # Gate 1: TypeScript type checking
      - name: Typecheck
        run: pnpm typecheck

      # Gate 2: ESLint
      - name: Lint
        run: pnpm lint

      # Gate 3: Prettier formatting
      - name: Format check
        run: pnpm format:check

      # Gate 4: Unit tests + coverage gate (Vitest - services + Zod schemas)
      # Runs coverage so the ratchet thresholds in vitest.config.ts actually gate PRs.
      # Previously this ran `pnpm test`, leaving the thresholds decorative.
      - name: Test (with coverage gate)
        run: pnpm test:coverage

      # Gate 5: Next.js build
      - name: Build
        run: pnpm build
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Stripe
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Les 9 prix reellement exiges par src/lib/stripe/server.ts (3 plans x 3
          # periodicites). La CI declarait ESSENTIEL/PREMIUM: des noms qui n'existent
          # nulle part dans le code. Le build passait quand meme parce que la lecture
          # est paresseuse derriere un Proxy - mais toute execution touchant un prix
          # (checkout, portail, webhook) explosait au runtime sur un requireEnv.
          NEXT_PUBLIC_STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_STARTER_SEMIANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_SEMIANNUAL }}
          NEXT_PUBLIC_STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_YEARLY }}
          NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_PRO_SEMIANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_SEMIANNUAL }}
          NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY }}
          NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_SEMIANNUAL: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_SEMIANNUAL }}
          NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_YEARLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_YEARLY }}
          # App
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
          # Sentry
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Upstash Redis (rate limiting)
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  # E2E smoke tests (Playwright). Scoped to the DB-free marketing/landing specs
  # (home + segments) which render without auth or a seeded database. The
  # DB-backed specs (admin-dashboard, responsive) need a seeded test database
  # and auth bypass; enabling them in CI is blocked on schema versioning
  # (a versioned baseline so a test DB can be provisioned) and is tracked
  # separately. The playwright config boots `pnpm dev` via its webServer block.
  e2e:
    name: E2E Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        # Pas de `version:` ici. La version vient de `packageManager` dans
        # package.json, seule source de verite: c'est ce qui garantit que la CI
        # installe la meme version que la machine de dev. Definir les deux fait
        # echouer l'action des l'installation ("Multiple versions of pnpm
        # specified"), ce qui bloque toute PR touchant package.json.
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm test:e2e:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}

  # LOT 7.3 [TEST-03]. Les parcours critiques tournent contre une base Supabase
  # LOCALE et EPHEMERE, creee par `supabase start` a chaque run. C'est ce qui
  # debloque ce que le job E2E ci-dessus ne peut pas faire (voir son commentaire):
  # plus besoin d'une base partagee versionnee, la stack est jetable.
  #
  # AUCUN secret. Les cles `service_role` sont generees par la stack locale, et
  # le seed comme le teardown ne touchent qu'elle. C'est la condition pour que ce
  # job tourne sur les PR de forks sans exposer quoi que ce soit.
  #
  # Les jobs Stripe (parcours 01 et 06) restent NOCTURNES, jamais sur PR: le
  # compte Stripe a une limite de Test Clocks actives, et deux PR concurrentes
  # se casseraient mutuellement.
  journeys:
    name: Journeys (BOLA + commande + permissions)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        # Pas de `version:` ici, meme raison que le job e2e: la version vient de
        # `packageManager` dans package.json. En definir une seconde fait echouer
        # l'action ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Supabase CLI
        # `run-journeys-local.sh` appelle `supabase` en global, pas via pnpm.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours critiques (Supabase local ephemere)
        # UN SEUL argument, pas trois invocations. Playwright traite l'argument
        # positionnel comme une regex sur les chemins: les trois parcours
        # tournent donc sur UN seul bootstrap. Trois invocations redemarreraient
        # la stack Supabase trois fois, soit 6 a 10 minutes perdues pour rien.
        run: bash scripts/run-journeys-local.sh "08-bola|04-service|03-staff"

      - name: Rapport Playwright (en cas d echec)
        # Sans cet artefact, un echec de parcours n'est qu'une ligne rouge: le
        # rapport HTML porte la trace, la capture et le DOM du moment exact.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-report
          path: playwright-report-journeys/
          retention-days: 7
