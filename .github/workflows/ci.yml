name: CI

on:
  # `push:` sans restriction declenchait CI DEUX FOIS par commit d'une PR: une
  # fois sur le push de la branche, une fois sur la pull_request. Mesure sur la
  # PR #327: `Quality Gates`, `E2E Smoke` et `Journeys` apparaissaient en double.
  # Double consommation de minutes, et double pression sur l'API GitHub - c'est
  # ce qui a fait tomber `supabase/setup-cli` sur "rate limit exceeded".
  # Tous les autres workflows de ce depot restreignent deja leur push a `main`.
  #
  # Consequence assumee: un push sur une branche SANS pull_request ouverte ne
  # declenche plus CI. Le flux de ce depot passe toujours par une PR, et les
  # cinq portes restent donc jouees avant tout merge.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        # Pas de `version:` ici. La version vient de `packageManager` dans
        # package.json, seule source de verite: c'est ce qui garantit que la CI
        # installe la meme version que la machine de dev. Definir les deux fait
        # echouer l'action des l'installation ("Multiple versions of pnpm
        # specified"), ce qui bloque toute PR touchant package.json.
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Gate 0: Critical files — ensure security-critical files exist
      - name: Critical files guard
        run: |
          CRITICAL_FILES=(
            "src/proxy.ts"
            "src/lib/supabase/client.ts"
            "src/lib/supabase/server.ts"
            "src/lib/supabase/admin.ts"
            "src/lib/supabase/middleware.ts"
            "src/lib/rate-limit.ts"
          )
          MISSING=0
          for f in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::CRITICAL FILE MISSING: $f — this file is required for auth, security, and multi-tenant isolation."
              MISSING=1
            fi
          done
          if [ $MISSING -eq 1 ]; then
            echo "::error::One or more critical files are missing. This will break authentication and tenant isolation. Restore them before merging."
            exit 1
          fi
          echo "All critical files present."

      # L'audit de dependances N'EST PAS ici. Il vit dans security.yml, job
      # "Dependency Audit": `pnpm audit --prod --audit-level=high`, deja
      # bloquant, declenche sur les memes evenements (push main + PR vers main).
      #
      # Une premiere version de ce lot avait ajoute ici une seconde porte
      # d'audit, en justifiant par "c'est ce qui a laisse 7 failles critiques
      # passer". Le contre-audit a montre que la premisse etait fausse: la porte
      # bloquante existait deja. Les 7 failles critiques (dont des RCE non
      # authentifiees de Next 16.2.12) n'ont franchi aucune porte - elles sont
      # simplement apparues APRES le dernier merge, le 14 aout 2026, et aucune
      # PR n'a ete ouverte depuis. Une porte ne protege que ce qui la traverse.
      #
      # Dupliquer la commande n'aurait rien ajoute, et l'aurait placee AVANT
      # typecheck/lint/test/build - un appel reseau sans `continue-on-error`,
      # donc une panne de registre aurait fait echouer la CI entiere pour une
      # raison sans rapport avec le code.
      #
      # LE VRAI DEFAUT, lui, est ailleurs et n'est pas corrigeable dans ce
      # fichier: la branche `main` n'a AUCUNE protection (mesure le 2026-11-04,
      # l'API repond "Branch not protected"). Aucune de ces portes n'est donc
      # REQUISE: une PR rouge peut etre mergee. Tant que la protection de
      # branche n'est pas activee avec ces verifications en checks requis, les
      # 5 portes sont consultatives.

      # Gate 1: TypeScript type checking
      - name: Typecheck
        run: pnpm typecheck

      # Gate 2: ESLint
      - name: Lint
        run: pnpm lint

      # Gate 3: Prettier formatting
      - name: Format check
        run: pnpm format:check

      # Gate 4: Unit tests + coverage gate (Vitest - services + Zod schemas)
      # Runs coverage so the ratchet thresholds in vitest.config.ts actually gate PRs.
      # Previously this ran `pnpm test`, leaving the thresholds decorative.
      - name: Test (with coverage gate)
        run: pnpm test:coverage

      # Tests des scripts shell. Vitest ne les voit pas, et un test sans
      # executant ne protege rien (lecon des tests pgTAP, qui sont restes sans
      # executant pendant des mois). La sortie est grep-friendly, comme les
      # autres portes: ^promote-prod: N/N passed
      - name: Tests des scripts
        run: |
          set -euo pipefail
          for essai in scripts/__tests__/*.test.sh; do
            echo "::group::$essai"
            bash "$essai"
            echo "::endgroup::"
          done

      # Gate 5: Next.js build
      - name: Build
        run: pnpm build
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Stripe
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          # Les 9 prix reellement exiges par src/lib/stripe/server.ts (3 plans x 3
          # periodicites). La CI declarait ESSENTIEL/PREMIUM: des noms qui n'existent
          # nulle part dans le code. Le build passait quand meme parce que la lecture
          # est paresseuse derriere un Proxy - mais toute execution touchant un prix
          # (checkout, portail, webhook) explosait au runtime sur un requireEnv.
          NEXT_PUBLIC_STRIPE_PRICE_STARTER_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_STARTER_YEARLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_STARTER_YEARLY }}
          NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_PRO_YEARLY }}
          NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_MONTHLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_MONTHLY }}
          NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_YEARLY: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_BUSINESS_YEARLY }}
          # App
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}
          # Sentry
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Upstash Redis (rate limiting)
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

  # E2E smoke tests (Playwright). Scoped to the DB-free marketing/landing specs
  # (home + segments) which render without auth or a seeded database. The
  # DB-backed specs (admin-dashboard, responsive) need a seeded test database
  # and auth bypass; enabling them in CI is blocked on schema versioning
  # (a versioned baseline so a test DB can be provisioned) and is tracked
  # separately. The playwright config boots `pnpm dev` via its webServer block.
  e2e:
    name: E2E Smoke
    # Fige sur 24.04: GitHub a bascule `ubuntu-latest` sur Ubuntu 26.04 le
    # 2026-11-04, et Playwright 1.58.2 ne connait pas cette image - l'install du
    # navigateur echoue AVANT le moindre test ("Playwright does not support
    # chromium on ubuntu26.04-x64"), donc ce job ne testait plus rien tout en
    # paraissant rouge pour une raison de code. A remettre sur `ubuntu-latest`
    # des que Playwright est monte a une version qui supporte 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        # Pas de `version:` ici. La version vient de `packageManager` dans
        # package.json, seule source de verite: c'est ce qui garantit que la CI
        # installe la meme version que la machine de dev. Definir les deux fait
        # echouer l'action des l'installation ("Multiple versions of pnpm
        # specified"), ce qui bloque toute PR touchant package.json.
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: pnpm test:e2e:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_APP_DOMAIN: ${{ secrets.NEXT_PUBLIC_APP_DOMAIN }}

  # LOT 7.3 [TEST-03]. Les parcours critiques tournent contre une base Supabase
  # LOCALE et EPHEMERE, creee par `supabase start` a chaque run. C'est ce qui
  # debloque ce que le job E2E ci-dessus ne peut pas faire (voir son commentaire):
  # plus besoin d'une base partagee versionnee, la stack est jetable.
  #
  # AUCUN secret. Les cles `service_role` sont generees par la stack locale, et
  # le seed comme le teardown ne touchent qu'elle. C'est la condition pour que ce
  # job tourne sur les PR de forks sans exposer quoi que ce soit.
  #
  # Les jobs Stripe (parcours 01 et 06) restent NOCTURNES, jamais sur PR: le
  # compte Stripe a une limite de Test Clocks actives, et deux PR concurrentes
  # se casseraient mutuellement.
  journeys:
    name: Journeys (BOLA + commande + permissions)
    # Fige sur 24.04: GitHub a bascule `ubuntu-latest` sur Ubuntu 26.04 le
    # 2026-11-04, et Playwright 1.58.2 ne connait pas cette image - l'install du
    # navigateur echoue AVANT le moindre test ("Playwright does not support
    # chromium on ubuntu26.04-x64"), donc ce job ne testait plus rien tout en
    # paraissant rouge pour une raison de code. A remettre sur `ubuntu-latest`
    # des que Playwright est monte a une version qui supporte 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        # Pas de `version:` ici, meme raison que le job e2e: la version vient de
        # `packageManager` dans package.json. En definir une seconde fait echouer
        # l'action ("Multiple versions of pnpm specified").
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm modules
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Supabase CLI
        # `run-journeys-local.sh` appelle `supabase` en global, pas via pnpm.
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Parcours critiques (Supabase local ephemere)
        # UN SEUL argument, pas trois invocations. Playwright traite l'argument
        # positionnel comme une regex sur les chemins: les trois parcours
        # tournent donc sur UN seul bootstrap. Trois invocations redemarreraient
        # la stack Supabase trois fois, soit 6 a 10 minutes perdues pour rien.
        run: bash scripts/run-journeys-local.sh "08-bola|04-service|03-staff"

      - name: Rapport Playwright (en cas d echec)
        # Sans cet artefact, un echec de parcours n'est qu'une ligne rouge: le
        # rapport HTML porte la trace, la capture et le DOM du moment exact.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-report
          path: playwright-report-journeys/
          retention-days: 7
