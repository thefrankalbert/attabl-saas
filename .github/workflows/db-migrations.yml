# Database migrations via CI: a read-only dry-run on pull requests, and an
# automatic apply to STAGING on push to main (skipped while STAGING_DB_URL is
# not configured).
#
# There is NO production job, on purpose (2026-11-20). It used to run
# `supabase db push` against production when a GitHub Release was published,
# with no approval gate (the "Production" environment has no required
# reviewer). The migration history table of production is out of sync with the
# migration files (47 versions in the database without a file, about 40 files
# without a row), so `db push` there would re-apply or skip migrations blindly.
# Production migrations are applied one by one with psql, after a backup, and
# checked by EXISTENCE in the database (see agent_docs/database-conventions.md).
#
# Required repository secret:
#   STAGING_DB_URL      session-pooler connection string for the staging project

name: DB Migrations

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

concurrency:
  group: db-migrations-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege: the token can only read the code. A job that needs more
# asks for it in its own `permissions:` block.
permissions:
  contents: read

jobs:
  dry-run:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.1.0
      - name: Show pending migrations (read-only, no apply)
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "STAGING_DB_URL not configured yet - skipping migration dry-run."
            echo "Create a staging Supabase project + set the repo secret to enable"
            echo "this gate (see docs/DATABASE-MIGRATIONS.md)."
            exit 0
          fi
          supabase migration list --db-url "$STAGING_DB_URL"

  staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 3.1.0
      - name: Apply migrations to staging
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}
        run: |
          if [ -z "$STAGING_DB_URL" ]; then
            echo "STAGING_DB_URL not configured yet - skipping staging apply."
            echo "Create a staging Supabase project + set the repo secret to enable"
            echo "this step (see docs/DATABASE-MIGRATIONS.md)."
            exit 0
          fi
          supabase db push --db-url "$STAGING_DB_URL"
